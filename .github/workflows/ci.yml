name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No offensive security binaries are installed. The suite runs against mocked
# binaries and fixture scripts, so CI never scans anything.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the Windows matrix to the ends of the supported range.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run tests
        run: pytest -v --timeout=300

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pytest --cov=nexhunter --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true  # formatting is advisory until the tree is normalized

      - name: mypy
        run: mypy --explicit-package-bases . --ignore-missing-imports

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Bandit
        run: bandit -r . -x ./tests,./build --severity-level medium

      - name: pip-audit
        run: pip-audit --strict
        continue-on-error: true  # advisory: fails on upstream advisories we cannot fix

      - name: Security regression tests
        # These encode the guarantees the project is built on: no arbitrary
        # command execution, no shell, secrets redacted.
        run: |
          pytest tests/test_no_passthrough.py \
                 tests/test_redaction.py \
                 tests/test_execution_service.py \
                 tests/test_execution.py -v

  build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify the CLI installs and runs
        run: |
          pip install dist/*.whl
          nexhunter doctor --no-versions
