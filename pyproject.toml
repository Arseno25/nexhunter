[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexhunter"
version = "1.0.0"
description = "Tool-driven AI security orchestration for authorized assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arseno25" }]
keywords = ["security", "mcp", "orchestration", "pentest", "assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# The minimal install runs the CLI, the registry, and the execution layer.
# Anything heavier is opt-in.
dependencies = [
    "defusedxml>=0.7",
]

[project.optional-dependencies]
api = []
mcp = ["fastmcp>=2.0"]
browser = ["selenium>=4.18"]
reports = ["jinja2>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
nexhunter = "nexhunter.cli.client:main"

[project.urls]
Homepage = "https://github.com/Arseno25/nexhunter"
Issues = "https://github.com/Arseno25/nexhunter/issues"

# This repository's root directory is itself the "nexhunter" package (it holds
# __init__.py), so the package is mapped explicitly rather than discovered.
# Auto-discovery from here would scan sibling directories outside the project.
[tool.setuptools]
packages = [
    "nexhunter",
    "nexhunter.agents",
    "nexhunter.api",
    "nexhunter.cli",
    "nexhunter.core",
    "nexhunter.execution",
    "nexhunter.findings",
    "nexhunter.security",
    "nexhunter.workflows",
]

[tool.setuptools.package-dir]
"nexhunter" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tests drive real subprocesses for timeout and tree-kill coverage, so they
# are not instantaneous.
timeout = 300

[tool.coverage.run]
source = ["nexhunter"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "S603",   # subprocess calls are the point of this tool; argv is validated
    "S607",   # tools are resolved from PATH by design
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are how these tests report

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]
